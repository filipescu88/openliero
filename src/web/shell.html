<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Liero</title>
<meta name="description" content="Kultowa strzelanka robaków w przeglądarce — zagraj ze znajomym przez internet.">
<!-- Podgląd linku (WhatsApp, Messenger, ...) dla zaproszeń ?join=KOD. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Liero — zagraj ze mną!">
<meta property="og:description" content="Kultowa strzelanka robaków w przeglądarce. Otwórz link, a gra sama dołączy do pokoju.">
<!-- __SITE_URL__ podmienia kontener „web” przy starcie (deploy/web-entrypoint.sh):
     WhatsApp potrzebuje pełnego adresu obrazka. -->
<meta property="og:image" content="__SITE_URL__/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, arial, sans-serif;
  }
  /* Kanwa zajmuje cały ekran w poziomie (gra 16:10 pośrodku, sterowanie na
     bocznych pasach); na ekranach wyższych niż 16:10 — największy prostokąt 16:10. */
  #canvas {
    position: fixed; display: block; background: #000; border: 0; outline: none;
    touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: #000; color: #ddd;
  }
  #loading.off { display: none; }
  #loading .bar { width: min(62vw, 340px); height: 8px; background: #1b1b1b; border-radius: 4px; overflow: hidden; }
  #loading .bar > i { display: block; height: 100%; width: 0; background: #bdd72e; transition: width .15s linear; }
  #status { font-size: 14px; letter-spacing: .02em; }
  /* Pion: gra jest w poziomie, więc zamiast malutkiego paska pokazujemy prośbę. */
  #rotate {
    position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    text-align: center; background: #000; color: #eee; font-size: 6vmin; line-height: 1.5; padding: 6vmin;
  }
  #rotate.on { display: flex; }
  #rotate small { font-size: 3.4vmin; color: #9aa; }
  #output {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 34vh; z-index: 25;
    background: rgba(0,0,0,.88); color: #ff9a9a; border: 0; font: 11px/1.35 monospace;
    padding: 6px; white-space: pre-wrap;
  }
  #output.on { display: block; }
  /* Pasek udostępniania kodu pokoju: prawdziwe przyciski DOM gwarantują
     user-activation dla navigator.share i schowka na iOS/Androidzie. */
  #invite {
    position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top));
    transform: translateX(-50%); z-index: 18; display: none;
    align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(20, 24, 28, .92); border: 1px solid rgba(189, 215, 46, .55);
    border-radius: 999px; padding: 6px 12px; color: #eee; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.6);
  }
  #invite.on { display: flex; }
  #invite b {
    font-family: ui-monospace, monospace; font-size: 15px; letter-spacing: .08em;
    color: #ffd166; padding: 0 4px;
  }
  #invite button {
    appearance: none; border: 0; border-radius: 999px; padding: 6px 12px;
    font: 600 12px/1 system-ui, sans-serif; cursor: pointer; touch-action: manipulation;
  }
  #invite .share-btn { background: #bdd72e; color: #111; }
  #invite .copy-btn { background: #2c353d; color: #eee; border: 1px solid #49545e; }
  #invite button:active { transform: scale(.96); }
</style>
</head>
<body>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<div id="invite" role="region" aria-label="Zaproszenie do pokoju">
  <span>Kod: <b id="invite-code">------</b></span>
  <button type="button" class="share-btn" id="invite-share">Udostępnij</button>
  <button type="button" class="copy-btn" id="invite-copy">Kopiuj link</button>
</div>

<div id="rotate"><div>Obróć telefon<br><small>gra działa w poziomie</small></div></div>

<div id="loading">
  <div id="status">Ładowanie…</div>
  <div class="bar"><i id="progress"></i></div>
</div>

<textarea id="output" rows="8" readonly></textarea>

<script>
  var GAME_W = 640, GAME_H = 400;          // rozdzielczość gry (kanwa)
  var canvasElement = document.getElementById('canvas');
  var statusElement = document.getElementById('status');
  var progressElement = document.getElementById('progress');
  var loadingElement = document.getElementById('loading');
  var rotateElement = document.getElementById('rotate');
  var outputElement = document.getElementById('output');
  var inviteElement = document.getElementById('invite');
  var inviteCodeElement = document.getElementById('invite-code');
  var inviteShareButton = document.getElementById('invite-share');
  var inviteCopyButton = document.getElementById('invite-copy');
  var currentRoomCode = '';

  function buildInviteUrl(code) {
    var u = new URL(location.href);
    var keep = u.searchParams.get('relay');
    u.search = '';
    u.hash = '';
    if (keep) { u.searchParams.set('relay', keep); }
    u.searchParams.set('join', code);
    return u.toString();
  }

  function copyTextToClipboard(text, onDone) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        if (onDone) { onDone(true); }
      }).catch(function () {
        fallbackCopyText(text, onDone);
      });
      return true;
    }
    return fallbackCopyText(text, onDone);
  }

  function fallbackCopyText(text, onDone) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (onDone) { onDone(!!ok); }
      return !!ok;
    } catch (e) {
      if (onDone) { onDone(false); }
      return false;
    }
  }

  function flashCopyLabel(label) {
    if (!inviteCopyButton) { return; }
    inviteCopyButton.textContent = label;
    window.clearTimeout(inviteCopyButton._timer);
    inviteCopyButton._timer = window.setTimeout(function () {
      inviteCopyButton.textContent = 'Kopiuj link';
    }, 1800);
  }

  window.setLieroInviteRoom = function (code) {
    currentRoomCode = code || '';
    if (currentRoomCode) {
      inviteCodeElement.textContent = currentRoomCode;
      inviteCopyButton.textContent = 'Kopiuj link';
      inviteElement.classList.add('on');
    } else {
      inviteElement.classList.remove('on');
    }
  };

  window.copyLieroInvite = function (code) {
    var c = code || currentRoomCode;
    if (!c) { return false; }
    var url = buildInviteUrl(c);
    return copyTextToClipboard(url, function (ok) {
      if (ok) { flashCopyLabel('Skopiowano!'); }
    });
  };

  window.shareLieroInvite = function (code) {
    var c = code || currentRoomCode;
    if (!c) { return ''; }
    var url = buildInviteUrl(c);
    var text = 'Zagraj ze mną w Liero! Kod pokoju: ' + c;
    copyTextToClipboard(url, function (ok) {
      if (ok) { flashCopyLabel('Skopiowano!'); }
    });
    if (navigator.share) {
      navigator.share({ title: 'Liero', text: text, url: url }).catch(function () {});
      return 'share';
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank');
    return 'whatsapp';
  };

  inviteShareButton.addEventListener('click', function (e) {
    e.stopPropagation();
    window.shareLieroInvite(currentRoomCode);
  });
  inviteCopyButton.addEventListener('click', function (e) {
    e.stopPropagation();
    window.copyLieroInvite(currentRoomCode);
  });

  function showError(text) {
    if (!outputElement.classList.contains('on')) { outputElement.classList.add('on'); }
    outputElement.value += text + '\n';
    outputElement.scrollTop = outputElement.scrollHeight;
    loadingElement.classList.add('off');
  }

  var Module = {
    canvas: canvasElement,
    print: function () {
      var text = Array.prototype.join.call(arguments, ' ');
      if (console && console.log) { console.log(text); }
      if (outputElement.classList.contains('on')) { showError(text); }
    },
    printErr: function () {
      // Komunikaty gry (stderr) ida do konsoli; panel pokazujemy tylko przy bledach.
      var text = Array.prototype.join.call(arguments, ' ');
      if (console && console.warn) { console.warn(text); }
      if (outputElement.classList.contains('on')) { showError(text); }
    },
    setStatus: function (text) {
      if (!text) {                                   // puste = koniec ładowania
        loadingElement.classList.add('off');
        statusElement.textContent = '';
        return;
      }
      statusElement.textContent = text;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        progressElement.style.width = (100 * parseInt(m[2], 10) / parseInt(m[4], 10)) + '%';
      }
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
    },
    postRun: [function () { loadingElement.classList.add('off'); }],
  };
  window.Module = Module;
  window.onerror = function (message) { showError('JS: ' + message); };
  window.onunhandledrejection = function (event) { showError('JS: ' + event.reason); };

  canvasElement.addEventListener('webglcontextlost', function (e) {
    showError('Utracono kontekst WebGL — odśwież stronę.');
    e.preventDefault();
  }, false);

  // --- Dopasowanie ekranu -------------------------------------------------
  function viewportSize() {
    var vv = window.visualViewport;
    return { w: Math.round(vv ? vv.width : window.innerWidth),
             h: Math.round(vv ? vv.height : window.innerHeight) };
  }

  var lastKey = '';
  function fit() {
    var v = viewportSize();
    if (v.w === 0 || v.h === 0) { return; }
    var key = v.w + 'x' + v.h + ':' + (canvasElement.width) + 'x' + (canvasElement.height);
    if (key === lastKey) { return; }
    lastKey = key;

    // Rozmiar bufora kanwy zostawiamy SDL-owi: ustawia go na rozmiar z CSS i sam
    // skaluje klatkę 640x400 (SDL_SetRenderLogicalPresentation). Wymuszanie tu
    // 640x400 rozjeżdżało się z oknem SDL i na dużym ekranie gra była powiększona
    // w lewy dolny róg. Dotyk jest liczony względem kanwy (0..1), więc nadal pasuje.

    // Ekran szerszy niż 16:10 (telefon w poziomie): kanwa na cały ekran — gra
    // zostaje 16:10 pośrodku, a sterowanie dotykowe ląduje na bocznych pasach
    // (gfx.cpp, OnWindowResize). Ekran wyższy: największy prostokąt 16:10.
    var ratio = GAME_W / GAME_H;
    var w = v.w, h = v.h;
    if (w / h < ratio) { h = w / ratio; }
    canvasElement.style.width = Math.round(w) + 'px';
    canvasElement.style.height = Math.round(h) + 'px';
    canvasElement.style.left = Math.round((v.w - w) / 2) + 'px';
    canvasElement.style.top = Math.round((v.h - h) / 2) + 'px';

    // Telefon trzymany w pionie: gra w poziomie była by paskiem, więc prosimy o obrót.
    rotateElement.classList.toggle('on', v.h > v.w * 1.15 && v.w < 900);
  }

  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { lastKey = ''; fit(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit);
    window.visualViewport.addEventListener('scroll', fit);
  }
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) { fullscreenAsked = false; }
    lastKey = '';
    fit();
  });
  window.setInterval(function () { lastKey = ''; fit(); }, 1000);

  // --- Pełny ekran na dotyk -----------------------------------------------
  // Bez tego telefon zostawia pasek adresu i podpowiedzi systemowe, które zjadają
  // kawałek ekranu w poziomie (a wtedy gra wygląda na obciętą). Nie prosimy o
  // pełny ekran, gdy czekamy na gracza w pokoju — wtedy dotyk ma otworzyć
  // udostępnianie (navigator.share wymaga niezużytego gestu użytkownika).
  var fullscreenAsked = false;
  function askFullscreen(e) {
    if (fullscreenAsked || currentRoomCode) { return; }
    if (e && e.target && e.target.closest && e.target.closest('#invite')) { return; }
    fullscreenAsked = true;
    var el = document.documentElement;
    try {
      if (document.fullscreenElement) { return; }
      var p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : null;
      if (p && p.then) {
        p.then(function () {
          lastKey = '';
          fit();
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function () {});
          }
        }).catch(function () { fullscreenAsked = false; });
      }
    } catch (e2) { /* np. iOS Safari: brak Fullscreen API na elemencie */ }
  }
  ['touchend', 'pointerup', 'mouseup'].forEach(function (type) {
    window.addEventListener(type, askFullscreen, { passive: true });
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
